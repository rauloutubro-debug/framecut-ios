name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device IPA
        run: bash scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrameCut-unsigned-IPA
          path: build/FrameCut-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
