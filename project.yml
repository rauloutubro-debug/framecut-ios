name: FrameCut
options:
  bundleIdPrefix: app.framecut
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Salvar os vídeos exportados na sua biblioteca.
targets:
  FrameCut:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.framecut.editor
        INFOPLIST_KEY_CFBundleDisplayName: FrameCut
